name: NALA
description: >-
  NALA is a fintech building cross-border payments infrastructure for emerging
  markets. Its consumer app is an international money-transfer and multi-currency
  account used to send money from the UK, US and EU to 35+ countries across
  Africa and Asia, with 98% of transfers arriving within minutes. NALA's B2B
  product, Rafiki, is a single API for global payouts and collections: move,
  collect and settle funds in local currency or stablecoins (USDC/USDT) across
  the US, UK, Europe, Asia and Africa, reaching 300+ banks and 40+ mobile-money
  operators with real-time FX, lookups, wallet statements, webhooks and built-in
  compliance and sanctions screening. Backed by Bessemer Venture Partners.
